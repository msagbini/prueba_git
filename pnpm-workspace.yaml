packages:
  - 'apps/*'
  - 'packages/*'
# react-router(-dom) reference "react" types via a bare `import` in their
# .d.ts, but only declare "react" itself (the runtime) as a peerDependency
# — not "@types/react". Without this, pnpm has no per-consumer signal for
# @types/react and falls back to a single shared hoisted copy, which two
# apps needing different React majors (apps/web on 18.x, apps/mobile on
# 19.x for React Native 0.86) will fight over non-deterministically. This
# makes @types/react a declared (loose) peer so pnpm resolves it the same
# peer-qualified way it already resolves "react" itself, per consumer.
packageExtensions:
  react-router@*:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  react-router-dom@*:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
# @nestjs/platform-express pins its own multer as an exact transitive
# version (2.0.2 as of NestJS 10.4.22 — the newest available on the 10.x
# line), several major versions behind multer's own fixes for a handful
# of DoS CVEs (deeply nested field names, incomplete cleanup, uncontrolled
# recursion — see docs/technical-log/phase-9.md). That was a low-priority,
# not-currently-reachable finding in the Fase 8 audit; Fase 9 adds a real
# file-upload route (job photo attachments) that actually calls into
# multer via FileInterceptor, making it worth fixing now rather than
# waiting on a NestJS 11 migration. multer's upload API has been stable
# across these versions, so forcing the newer patched version under
# NestJS's own dependency is a safe, narrow override — not a wholesale
# NestJS 11 upgrade.
overrides:
  multer: ^2.2.0
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
