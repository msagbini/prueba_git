info:
  title: DOS API
  description: >-
    Digital Operations System backend API. Every route except the ones marked
    @Public() requires a Bearer access token scoped to the caller's active
    organization.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SignupDto:
      type: object
      properties:
        organizationName:
          type: string
        industryVerticalCode:
          type: string
          enum:
            - CLEANING
            - CONSTRUCTION_CLEANING
            - MAINTENANCE
            - LANDSCAPING
            - GENERAL_FIELD_SERVICE
        ownerEmail:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        password:
          type: string
      required:
        - organizationName
        - industryVerticalCode
        - ownerEmail
        - ownerFirstName
        - ownerLastName
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    SelectOrganizationDto:
      type: object
      properties:
        selectionToken:
          type: string
          description: The short-lived selection token returned by POST /auth/login.
        organizationId:
          type: string
      required:
        - selectionToken
        - organizationId
    SwitchOrganizationDto:
      type: object
      properties:
        organizationId:
          type: string
      required:
        - organizationId
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
    VerifyEmailDto:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
      required:
        - token
        - newPassword
    InviteUserDto:
      type: object
      properties:
        email:
          type: string
        roleCode:
          type: string
          enum:
            - OWNER
            - ADMIN
            - DISPATCHER
            - STAFF
            - CLIENT
        clientId:
          type: string
          description: >-
            Required (and only meaningful) when roleCode is CLIENT — links the
            resulting membership to this Client record.
      required:
        - email
        - roleCode
    AcceptInvitationDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
    CreateCheckoutSessionDto:
      type: object
      properties:
        planCode:
          type: string
          enum:
            - FREE
            - PRO
            - BUSINESS
          description: The plan to subscribe to — must not be FREE.
      required:
        - planCode
    UpdateOrganizationDto:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        locale:
          type: string
        settings:
          type: object
          description: >-
            Vertical-specific configuration — see Organization.settings in
            schema.prisma.
    UpdateMembershipDto:
      type: object
      properties:
        roleCode:
          type: string
          enum:
            - OWNER
            - ADMIN
            - DISPATCHER
            - STAFF
            - CLIENT
        status:
          type: string
          enum:
            - INVITED
            - ACTIVE
            - SUSPENDED
    UpdateUserDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
    CreateClientDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - RESIDENTIAL
            - COMMERCIAL
        primaryContactName:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
      required:
        - name
        - type
    UpdateClientDto:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - RESIDENTIAL
            - COMMERCIAL
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        primaryContactName:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
    CreateClientAddressDto:
      type: object
      properties:
        label:
          type: string
          enum:
            - BILLING
            - SERVICE
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        lat:
          type: number
        lng:
          type: number
      required:
        - label
        - addressLine1
        - city
        - state
        - postalCode
        - country
    CreateServiceCategoryDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    CreateServiceDto:
      type: object
      properties:
        categoryId:
          type: string
        name:
          type: string
        description:
          type: string
        pricingType:
          type: string
          enum:
            - HOURLY
            - FIXED
            - PER_UNIT
        unitLabel:
          type: string
          description: Required when pricingType is PER_UNIT, e.g. "sq ft".
        basePrice:
          type: number
        isActive:
          type: boolean
          default: true
      required:
        - name
        - pricingType
        - basePrice
    UpdateServiceDto:
      type: object
      properties:
        categoryId:
          type: string
        name:
          type: string
        description:
          type: string
        pricingType:
          type: string
          enum:
            - HOURLY
            - FIXED
            - PER_UNIT
        unitLabel:
          type: string
        basePrice:
          type: number
        isActive:
          type: boolean
    CreateJobDto:
      type: object
      properties:
        clientId:
          type: string
        serviceAddressId:
          type: string
        scheduledStart:
          type: string
        scheduledEnd:
          type: string
        recurrenceRule:
          type: string
          description: RRULE string (RFC 5545) for recurring jobs.
        notes:
          type: string
      required:
        - clientId
    UpdateJobDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - DRAFT
            - SCHEDULED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        serviceAddressId:
          type: string
        scheduledStart:
          type: string
        scheduledEnd:
          type: string
        actualStart:
          type: string
          description: When work actually started — distinct from the scheduled time.
        actualEnd:
          type: string
          description: When work actually ended — distinct from the scheduled time.
        notes:
          type: string
    CreateJobAssignmentDto:
      type: object
      properties:
        membershipId:
          type: string
          description: The OrganizationMembership id of the staff member to assign.
      required:
        - membershipId
    CreateJobServiceDto:
      type: object
      properties:
        serviceId:
          type: string
        quantity:
          type: number
        notes:
          type: string
      required:
        - serviceId
        - quantity
    UpdateStaffDto:
      type: object
      properties:
        employeeCode:
          type: string
        hourlyRate:
          type: number
        hireDate:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
    CreateInvoiceDto:
      type: object
      properties:
        clientId:
          type: string
        issueDate:
          type: string
        dueDate:
          type: string
      required:
        - clientId
        - issueDate
        - dueDate
    UpdateInvoiceDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - DRAFT
            - SENT
            - PAID
            - OVERDUE
            - VOID
        dueDate:
          type: string
    CreateInvoiceLineItemDto:
      type: object
      properties:
        jobId:
          type: string
        serviceId:
          type: string
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
      required:
        - description
        - quantity
        - unitPrice
    CreatePaymentDto:
      type: object
      properties:
        invoiceId:
          type: string
        amount:
          type: number
        method:
          type: string
          enum:
            - CASH
            - CHECK
            - CARD
            - BANK_TRANSFER
            - OTHER
        referenceNumber:
          type: string
        notes:
          type: string
      required:
        - invoiceId
        - amount
        - method
